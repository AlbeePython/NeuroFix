[package]
name = "neurofix"
version = "1.3.0"
edition = "2021"
rust-version = "1.76"
description = "DNS management and network diagnostics utility for Windows"
license = "Apache-2.0"
readme = "README.md"

[dependencies]
eframe = { version = "=0.29.1", default-features = false, features = ["default_fonts", "glow"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
